<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — AfICTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../assets/dash.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <div class="login-logo-text">Af<span>ICTA</span></div>
          <div class="login-logo-sub">Admin Dashboard</div>
        </div>

        <h5 class="login-title">Welcome back</h5>
        <p class="login-sub">Sign in to manage the AfICTA website content.</p>

        <div class="alert alert-danger d-none" id="loginError" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          Invalid email or password. Please try again.
        </div>

        <form id="loginForm" action="index.html">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span
                class="input-group-text"
                style="
                  background: var(--gray-50);
                  border-color: var(--gray-200);
                "
                ><i class="bi bi-envelope" style="color: var(--green)"></i
              ></span>
              <input
                type="email"
                class="form-control"
                placeholder="admin@aficta.org"
                required
                value="admin@aficta.org"
              />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label d-flex justify-content-between">
              Password
              <a href="#" style="font-size: 0.78rem; color: var(--green)"
                >Forgot password?</a
              >
            </label>
            <div class="input-group">
              <span
                class="input-group-text"
                style="
                  background: var(--gray-50);
                  border-color: var(--gray-200);
                "
                ><i class="bi bi-lock" style="color: var(--green)"></i
              ></span>
              <input
                type="password"
                class="form-control"
                id="passwordInput"
                placeholder="••••••••"
                required
              />
              <button
                class="input-group-text"
                type="button"
                id="togglePw"
                style="
                  background: var(--gray-50);
                  border-color: var(--gray-200);
                  cursor: pointer;
                "
              >
                <i
                  class="bi bi-eye"
                  id="eyeIcon"
                  style="color: var(--gray-600)"
                ></i>
              </button>
            </div>
          </div>
          <div class="mb-4 d-flex align-items-center justify-content-between">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"
                >Remember me</label
              >
            </div>
          </div>
          <button
            type="submit"
            class="btn-green w-100 d-flex align-items-center justify-content-center gap-2"
            style="
              padding: 0.7rem;
              border-radius: var(--radius);
              font-size: 0.95rem;
            "
          >
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <a
            href="../index.html"
            style="font-size: 0.82rem; color: var(--green)"
          >
            <i class="bi bi-globe me-1"></i> Back to Website
          </a>
        </div>

        <p
          class="text-center mt-4 mb-0"
          style="font-size: 0.72rem; color: var(--gray-600)"
        >
          &copy; 2026 AfICTA. All Rights Reserved.
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("togglePw")?.addEventListener("click", () => {
        const pw = document.getElementById("passwordInput");
        const ic = document.getElementById("eyeIcon");
        if (pw.type === "password") {
          pw.type = "text";
          ic.className = "bi bi-eye-slash";
        } else {
          pw.type = "password";
          ic.className = "bi bi-eye";
        }
      });
    </script>
  </body>
</html>
